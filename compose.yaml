services:
  backend:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: sqlite:///./data/platform.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_data:/srv/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  backend_data:
